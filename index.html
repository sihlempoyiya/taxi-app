<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Front Seat - Taxi Money App</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container main-container py-3">
      <header class="text-center mb-4 border-bottom pb-3">
        <h1 class="fw-bold">FRONT SEAT</h1>
        <p class="text-muted small">The job nobody applies for</p>
      </header>

      <div class="card fare-card p-3 mb-3">
        <div class="d-flex justify-content-between align-items-center">
          <label class="fw-bold">Taxi Fare: R</label>
          <input
            id="fareInput"
            type="number"
            class="form-control fare-input"
            value="18"
            min="1"
          />
        </div>
      </div>

      <div class="row g-2 mb-4">
        <div class="col-4">
          <div class="summary-box box-collected">
            <small>Collected</small>
            <h5 id="totalCollected">R0</h5>
          </div>
        </div>
        <div class="col-4">
          <div class="summary-box box-owe">
            <small>Owe Change</small>
            <h5 id="totalChangeOwed">R0</h5>
          </div>
        </div>
        <div class="col-4">
          <div class="summary-box box-people">
            <small>Passengers</small>
            <h5 id="totalPeople">0</h5>
          </div>
        </div>
      </div>

      <div class="card p-3 mb-3">
        <h6 class="fw-bold">New Payment</h6>
        <form id="paymentForm">
          <input
            id="rowInput"
            class="form-control mb-2"
            placeholder="Row / Person - e.g. Back row"
            required
          />
          <div class="row g-2 mb-2">
            <div class="col-6">
              <input
                id="amountInput"
                type="number"
                class="form-control"
                placeholder="Amount given"
                required
              />
            </div>
            <div class="col-6">
              <input
                id="peopleInput"
                type="number"
                class="form-control"
                placeholder="For how many?"
                value="1"
                required
              />
            </div>
          </div>
          <p id="errorMsg" class="text-danger small d-none"></p>
          <button type="submit" class="btn btn-dark w-100 fw-bold">
            CALCULATE & ADD
          </button>
        </form>
        <div id="liveCalc" class="small text-muted mt-2"></div>
      </div>

      <h6 class="fw-bold mt-4">Payments Log</h6>
      <div id="paymentList"></div>
      <p id="emptyMsg" class="text-center text-muted small mt-4">
        No payments yet.
      </p>
    </div>
    <script src="script.js"></script>
  </body>
</html>
